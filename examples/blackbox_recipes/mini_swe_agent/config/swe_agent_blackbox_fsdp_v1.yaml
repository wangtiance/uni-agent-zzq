# FSDP + V1 unified trainer config for the blackbox mini-swe recipe.
#
# Entry point: python3 -m verl.trainer.main_ppo
# Default trainer mode is colocate_async. Trainer and rollout share all GPUs
# on a single 8-GPU node — vLLM sleeps during training, wakes up for rollout.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: false
  nccl_timeout: 9600

  model:
    path: ???
    use_remove_padding: true
    enable_activation_offload: true
    lora_rank: 32
    lora_alpha: 16
    target_modules: all-linear
    exclude_modules: null
    # Path to a pre-trained LoRA adapter for continued training (optional).
    lora_adapter_path: null
    lora:
      merge: true

  rollout:
    name: vllm
    mode: async
    nnodes: 1
    n_gpus_per_node: 8
    prompt_length: 4096
    response_length: 131072
    max_model_len: 135168
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 8
    tensor_model_parallel_size: 4
    gpu_memory_utilization: 0.7
    calculate_log_probs: true
    enable_sleep_mode: true
    free_cache_engine: true
    enable_chunked_prefill: true
    max_num_batched_tokens: 135168
    disable_log_stats: false

    val_kwargs:
      temperature: 1.0
      top_p: 0.95
      top_k: -1
      do_sample: true

    multi_turn:
      enable: true
      max_parallel_calls: 1
      format: qwen3_coder

    agent:
      num_workers: 8
      agent_loop_manager_class: uni_agent.framework.entry.AgentFrameworkRolloutAdapter

    custom:
      agent_framework:
        gateway_count: 1
        agent_runners:
          swe_agent:
            runner_fqn: examples.blackbox_recipes.mini_swe_agent.mini_swe_agent_runner.mini_swe_agent_runner
            dispatch_mode: ray_task
            max_concurrent_sessions: 128
            runner_kwargs:
              tool_image: swr.cn-east-3.myhuaweicloud.com/openyuanrong/mini-swe-agent-tool:latest
              run_timeout: 3600
              conda_env: testbed

  actor:
    strategy: fsdp
    use_dynamic_bsz: true
    use_rollout_log_probs: true
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 16384
    use_kl_loss: false
    kl_loss_coef: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    loss_agg_mode: token-mean
    entropy_coeff: 0
    entropy_checkpointing: true
    entropy_from_logits_with_chunking: true
    optim:
      lr: 1e-5  # 1e-5 for lora, 1e-6 for full model
      weight_decay: 0.1
      lr_scheduler_type: constant
    checkpoint:
      strict: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      dtype: bfloat16

  ref:
    strategy: fsdp
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false
      dtype: bfloat16

data:
  train_files: ???
  val_files: ???
  prompt_key: prompt
  truncation: left
  max_prompt_length: 4096
  max_response_length: 131072
  train_batch_size: 1
  val_batch_size: 1
  gen_batch_size: 1
  return_raw_chat: true
  trust_remote_code: true
  dataloader_num_workers: 0
  custom_cls:
    path: pkg://examples.blackbox_recipes.mini_swe_agent.dataset
    name: SWEBenchDataset

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
  rollout_correction:
    bypass_mode: true

reward:
  custom_reward_function:
    path: pkg://examples.blackbox_recipes.mini_swe_agent.reward
    name: compute_score

trainer:
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 10
  total_training_steps: null
  project_name: swe_agent_blackbox
  experiment_name: swe_agent
  logger:
    - console
  device: cuda
  val_before_train: true
  val_only: false
  save_freq: 10
  test_freq: 10
  default_local_dir: checkpoints/swe_agent_blackbox
  resume_mode: auto
  use_v1: true
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
    separate_async:
      num_warmup_batches: 4
      parameter_sync_step: 4

transfer_queue:
  enable: true

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        TRANSFER_QUEUE_ENABLE: ""
        MAX_TURNS: "100"
        SWE_AGENT_MAX_TURNS: "100"
        DEBUG_MODE: "true"
        SANDBOX_NAME_PREFIX: "mini-swe-"
